[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mp268"
version = "0.1.0"
description = "MP268 Fuel Station Daily Sales (Surat): SCSE3040 MLOps mini project, group G252"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mp268*"]

[tool.pytest.ini_options]
# Lets a plain `pytest` (as CI runs it) import `mp268` from src/ and `app` / `src.*` from the
# repo root without installing anything. Without this, collection fails with ModuleNotFoundError.
pythonpath = ["src", "."]
testpaths = ["tests"]
