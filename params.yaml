paths:
  raw_train: "data/raw/train.csv"
  raw_later: "data/raw/later.csv"
  holdout: "data/raw/holdout_features.csv"
  clean_train: "data/processed/train_clean.csv"
  model_path: "models/model.joblib"
  predictions_path: "predictions/holdout_predictions.csv"

features:
  numeric:
    - highway_distance_km
    - nearby_pumps
    - price_rs
    - trucks_passing
    - temp_c
    - staff
  categorical:
    - ownership
    - zone
  target: "litres_per_day"
  leaking_column: "litres_from_tank_dip_next_day"

cleaning:
  unit_mixup_zone: "Industrial"
  unit_mixup_column: "highway_distance_km"
  unit_mixup_factor: 1000.0
  staff_sentinel: 9999
  ownership_map:
    public_sector: "public_sector"
    "pub.": "public_sector"
    "public sector": "public_sector"
    cooperative: "cooperative"
    "coo.": "cooperative"
    private: "private"
    "pri.": "private"

validation:
  max_trucks_passing: 4000
  min_staff: 1.5

# --- added by Kartik: read by src/mp268/config.py and src/mp268/findings.py
columns:
  id: record_id
  date: date
  group: zone            # the "group column" of the handbook (unit_mixup, MAE per group)

checks:
  leak_min_abs_corr: 0.95    # |rank correlation| with the target at or above this = leak suspect
  typo_min_gap_ratio: 1.5    # normal top values step by ~1.03x; a 10x typo cluster leaves a far bigger gap

# --- added by Kartik: read by src/mp268/train.py
mlflow:
  tracking_uri: "sqlite:///mlflow.db"          # file in the repo root (handbook section 8)
  experiment_name: "mp268-fuel-sales"
  registered_model_name: "mp268-fuel-sales-model"

split:                       # chronological, inside cleaned train.csv
  val_size: 0.2              # next 20% of days after train: used to choose v1
  test_size: 0.2             # newest 20% of days: touched once, for the final check

models:                      # every entry = one MLflow run; lowest mae_val becomes v1
  - name: median_baseline
    type: dummy
    params: {strategy: median}
  - name: ridge_a0.1
    type: ridge
    params: {alpha: 0.1}
  - name: ridge_a1
    type: ridge
    params: {alpha: 1.0}
  - name: ridge_a10
    type: ridge
    params: {alpha: 10.0}
  - name: gbr_depth2
    type: gbr
    params: {n_estimators: 400, learning_rate: 0.05, max_depth: 2, subsample: 0.8, random_state: 42}
  - name: gbr_depth3
    type: gbr
    params: {n_estimators: 300, learning_rate: 0.05, max_depth: 3, subsample: 0.8, random_state: 42}
  - name: random_forest
    type: rf
    params: {n_estimators: 300, min_samples_leaf: 5, random_state: 42, n_jobs: -1}
